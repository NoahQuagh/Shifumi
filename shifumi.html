<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shifumi</title>
    <link rel="stylesheet" href="assets/style/styleShifumi.css"/>
</head>

<body>
<header>
    <h1>Shifumi</h1>
    <section id="score">
        <p id="win">0 victoire</p>
        <p id="draw">0 égalité</p>
        <p id="lose">0 défaite</p>
    </section>
    <button id="reset" type="button" aria-label="Réinitialiser le score" onclick="resetScore()">Réinitialiser le score</button>

</header>
<main>
    <button class="choice-btn" id="rock" aria-label="Choisir Pierre" type="button">Pierre</button>
    <button class="choice-btn" id="paper" aria-label="Choisir Feuille" type="button">Feuille</button>
    <button class="choice-btn" id="scissor" aria-label="Choisir Ciseaux" type="button">Ciseaux</button>
</main>
<section id="result-display" aria-live="polite"></section>
<script defer src="assets/js/scriptShifumi.js"></script>
</body>
</html>
